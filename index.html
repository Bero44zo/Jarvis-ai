<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JARVIS V1</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #090c12;
      color: #f4f7fb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      width: 100%;
      max-width: 700px;
      min-height: 100vh;
      margin: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 12px 4px 18px;
      border-bottom: 1px solid #252b35;
    }

    .title {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    .status {
      margin-top: 5px;
      color: #73d66b;
      font-size: 13px;
    }

    #chat {
      flex: 1;
      padding: 22px 0;
      overflow-y: auto;
    }

    .message {
      max-width: 88%;
      padding: 13px 16px;
      margin: 10px 0;
      border-radius: 18px;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .jarvis {
      background: #151b24;
      border: 1px solid #28313e;
    }

    .user {
      background: #24344a;
      margin-left: auto;
    }

    form {
      display: flex;
      gap: 9px;
      padding-top: 10px;
      border-top: 1px solid #252b35;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 15px;
      border-radius: 16px;
      border: 1px solid #303846;
      background: #11161e;
      color: white;
      font-size: 16px;
    }

    button {
      width: 54px;
      border: 0;
      border-radius: 16px;
      background: #4c8bf5;
      color: white;
      font-size: 22px;
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <div class="title">JARVIS</div>
      <div class="status">● V1 · ONLINE</div>
    </header>

    <main id="chat">
      <div class="message jarvis">
        Hallo. Ich bin JARVIS. Was kann ich für dich tun?
      </div>
    </main>

    <form id="form">
      <input
        id="input"
        autocomplete="off"
        placeholder="Schreib JARVIS..."
      >

      <button type="submit">➤</button>
    </form>

  </div>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const chat = document.getElementById("chat");

    function addMessage(text, type) {
      const message = document.createElement("div");

      message.className = "message " + type;
      message.textContent = text;

      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;

      return message;
    }

    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      const text = input.value.trim();

      if (!text) return;

      addMessage(text, "user");

      input.value = "";

      const thinking = addMessage(
        "JARVIS denkt ...",
        "jarvis"
      );

      try {

        const response = await fetch("/api/chat", {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message: text
          })
        });

        const data = await response.json();

        if (response.ok) {
          thinking.textContent =
            data.reply || "Keine Antwort erhalten.";
        } else {
          thinking.textContent =
            "Fehler: " + (data.error || "Unbekannter Fehler");
        }

      } catch (error) {

        thinking.textContent =
          "Verbindungsfehler. Bitte später erneut versuchen.";

      }

    });
  </script>

</body>
</html>
